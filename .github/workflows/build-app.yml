name: Build app

# On every push to master: package the app and attach downloadable artifacts
# to the workflow run; leave a commit comment with the download link.
on:
  push:
    branches: [master]
    paths:
      - "apps/anyworker/**"
      - "scripts/package-app.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  package:
    name: Package app artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # commit comments
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Package
        run: bash scripts/package-app.sh
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anyworker-app-${{ github.sha }}
          path: dist/app/**
          if-no-files-found: error
          retention-days: 30
      - name: Comment download link on commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(cat <<EOF
          ### AnyWorker app build

          Commit \`${{ github.sha }}\`

          **Download artifacts:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts

          Contents: GUI zip + Python server wheel (see \`manifest.json\` inside the artifact).
          EOF
          )
          gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$BODY"
