[project]
name = "anyworker-server"
version = "0.1.0"
description = "AnyWorker local agent server — Claude Agent SDK harness + multi-provider settings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "websockets>=14.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "platformdirs>=4.3.0",
  "pymupdf>=1.24.0",
  "openpyxl>=3.1.0",
  "python-magic>=0.4.27",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
anyworker-server = "anyworker.server.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anyworker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.0",
]
